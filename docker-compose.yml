# This file serves as the base to build on top on.
# Uses the "separate containers" setup: https://github.com/nginx-proxy/nginx-proxy/blob/main/docs/README.md#separate-containers
version: "3.8"
services:
  # https://hub.docker.com/_/nginx
  nginx:
    # https://hub.docker.com/_/nginx/tags
    image: nginx:1.31.9-alpine

    labels:
      # Lets docker-gen find the nginx container to reload it
      - com.github.nginx-proxy.nginx-proxy.nginx
      # Lets acme-companion find the nginx container
      - com.github.nginx-proxy.nginx

    # https://www.baeldung.com/ops/docker-compose-restart-policies
    restart: always

    # Map http and https ports to host machine
    ports:
      - 80:80
      - 443:443

    # https://docs.docker.com/storage/volumes/
    # Define a named volume to persist data.
    # nginx does not need the docker socket, only docker-gen and the companion do.
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - vhost:/etc/nginx/vhost.d:ro
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam:ro
      - certs:/etc/nginx/certs:ro

    # Reverse proxy network.
    networks:
      - default
      - nginxproxynet

  # https://hub.docker.com/r/nginxproxy/nginx-proxy
  # The dockergen tag only contains docker-gen and nginx.tmpl. It renders conf.d/default.conf and reloads nginx.
  docker-gen:
    # https://hub.docker.com/r/nginxproxy/nginx-proxy/tags
    image: nginxproxy/nginx-proxy:1.11.6-dockergen

    labels:
      # Lets acme-companion find the docker-gen container
      - com.github.nginx-proxy.docker-gen

    # https://www.baeldung.com/ops/docker-compose-restart-policies
    restart: always

    # https://docs.docker.com/compose/compose-file/05-services/#depends_on
    depends_on:
      - nginx

    # https://docs.docker.com/storage/volumes/
    # Define /var/run/docker.sock to scan docker containers
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d:ro
      - html:/usr/share/nginx/html:ro
      - dhparam:/etc/nginx/dhparam:ro
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro

    # Internal network without outside access, docker-gen only needs the docker socket.
    networks:
      - nginxgen

  # https://hub.docker.com/r/nginxproxy/acme-companion
  companion:
    # https://hub.docker.com/r/nginxproxy/acme-companion/tags
    image: nginxproxy/acme-companion:2.8.2

    # https://www.baeldung.com/ops/docker-compose-restart-policies
    restart: always

    # https://docs.docker.com/compose/compose-file/05-services/#depends_on
    depends_on:
      - nginx
      - docker-gen

    # All configs should be set here as environment variable
    environment:
      DEFAULT_EMAIL: ${DEFAULT_EMAIL:?Missing environment variable see readme}

    # https://docs.docker.com/storage/volumes/
    # Define a named volume to persist data.
    # Define /var/run/docker.sock to scan docker containers
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # Needs outbound internet for the ACME server, so not the internal network.
    networks:
      - default

volumes:
  conf:
  vhost:
  html:
  dhparam:
  certs:
  acme:

networks:
  # Internal network for docker-gen. See: https://github.com/nginx-proxy/nginx-proxy/blob/main/docs/README.md#separate-containers
  nginxgen:
    name: nginxgen
    internal: true

  # Reverse proxy network. See: https://github.com/Good-Games-Munich/nginx
  nginxproxynet:
    name: nginxproxynet
